# Modello: installare esclusivamente in .github/workflows/android-release.yml di MoscoRun-private.
name: MoscoRun - APK ufficiale privato
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "SHA completo del main sorgente revisionato e approvato"
        required: true
        type: string
      version_code:
        description: "VersionCode maggiore dell'ultimo distribuito"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: android-official-release
  cancel-in-progress: false
jobs:
  build:
    if: github.event.repository.private && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: source/android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: littlefly1969/Moscorun
          ref: main
          path: source
          persist-credentials: false
          token: ${{ secrets.MOSCORUN_SOURCE_READ_TOKEN || github.token }}
      - name: Verifica commit approvato, identita e versione
        working-directory: source
        env:
          APPROVED_SHA: ${{ inputs.source_sha }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          sha = os.environ["APPROVED_SHA"]
          version = os.environ["VERSION_CODE"]
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("SHA completo non valido")
          if subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() != sha:
              raise SystemExit("main sorgente non coincide con lo SHA approvato")
          if not re.fullmatch(r"[1-9][0-9]{0,9}", version) or int(version) > 2100000000:
              raise SystemExit("VersionCode non valido")
          identity = json.loads(Path("android/signing/identity.json").read_text())
          if identity["applicationId"] != "it.littlefly.moscorun" or identity["sha256"] != "5D:96:9C:4E:B0:ED:0C:28:3A:CE:AB:17:E2:38:C7:CC:6C:2F:BB:B0:AE:15:9E:A8:8A:B7:07:D6:08:B6:55:42":
              raise SystemExit("Identita Android non ufficiale")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"MOSCORUN_VERSION_CODE={version}\n")
          PY
      - name: Verifica configurazione Google Maps
        env:
          GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, re
          key = os.environ.get("GOOGLE_MAPS_ANDROID_API_KEY", "").strip()
          if not re.fullmatch(r"AIza[A-Za-z0-9_-]{35}", key):
              raise SystemExit("::error::Aggiungere il Repository secret GOOGLE_MAPS_ANDROID_API_KEY con la chiave Maps SDK for Android.")
          print("Chiave Maps presente e formato valido; valore non mostrato.")
          PY
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          cache-disabled: true
      - name: Installa piattaforma Android
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test degli script di firma e di verifica APK
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Senza l'SDK Samsung la build si ferma con una diagnostica esplicita
        run: |
          if bash gradlew :app:preBuild --no-daemon > "$RUNNER_TEMP/senza-sdk.log" 2>&1; then
            echo "::error::La build deve fallire quando manca l'AAR Samsung."; exit 1
          fi
          grep -q "Manca il Samsung Health Data SDK" "$RUNNER_TEMP/senza-sdk.log" \
            || { echo "::error::Diagnostica dell'AAR mancante non trovata."; tail -n 40 "$RUNNER_TEMP/senza-sdk.log"; exit 1; }
      - name: Scarica SDK Samsung privato
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/libs
          gh release download samsung-sdk-local --repo "$GITHUB_REPOSITORY" --pattern samsung-health-data-api.aar --dir app/libs
          echo 'f5d3d83cf00b97d0bb1b1db4da076e861eb1c3e6e704d89a34e68909d2f38654  app/libs/samsung-health-data-api.aar' | sha256sum --check
      - name: Test e analisi statica
        run: bash gradlew testDebugUnitTest lintDebug --no-daemon
      - name: Ripristina firma stabile
        env:
          MOSCORUN_SIGNING_BUNDLE: ${{ secrets.MOSCORUN_SIGNING_BUNDLE }}
        run: |
          python3 scripts/restore-signing.py --directory "$RUNNER_TEMP/moscorun-signing"
          echo "MOSCORUN_SIGNING_PROPERTIES=$RUNNER_TEMP/moscorun-signing/signing.properties" >> "$GITHUB_ENV"
      - name: Compila l'APK MoscoRun con firma stabile
        env:
          GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
        run: bash gradlew assembleDebug --no-daemon
      - name: Verifica che l'APK sia uno solo, con firma, identificativo, etichetta e versione attesi
        run: python3 scripts/verify-apks.py
      - name: Prepara l'artefatto con il solo APK
        run: |
          mkdir -p "$RUNNER_TEMP/apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/apk/MoscoRun-${MOSCORUN_VERSION_CODE}.apk"
          test "$(find "$RUNNER_TEMP/apk" -type f | wc -l)" -eq 1
      - name: Pubblica APK solo nel repository privato
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MoscoRun-apk-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/apk/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Rimuovi materiale di firma dal runner
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/moscorun-signing"
