name: Problema
description: Qualcosa non funziona come previsto
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Cosa succede
      description: Comportamento osservato e comportamento atteso.
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Versione
      description: "Da ./moscorun.sh status o /api/system/info"
  - type: textarea
    id: logs
    attributes:
      label: Log rilevanti
      description: Non incollare password, token o dati sanitari.
      render: text
