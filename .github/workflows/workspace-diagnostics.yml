name: Workspace diagnostics (temporary)

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnostics:
    if: github.head_ref == 'feat/scientific-workspace-ui'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Formatted source (diagnostic only)
        run: |
          npm run format
          node --input-type=module -e 'import {execFileSync} from "node:child_process"; import {readFileSync} from "node:fs"; for (const path of execFileSync("git",["diff","--name-only","--relative"],{encoding:"utf8"}).trim().split("\n").filter(Boolean)) console.log("WORKSPACE_FORMAT "+JSON.stringify({path:"web/"+path,content:readFileSync(path,"utf8")}));'
      - name: Lint
        run: npm run lint
      - name: Type check
        if: always()
        run: npm run typecheck
      - name: Tests
        if: always()
        run: npm run test -- src/features/workspace
