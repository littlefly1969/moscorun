name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.76.2
  SEMGREP_IMAGE: semgrep/semgrep:1.142.0
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.7
  NGINX_IMAGE: nginx:1.28.0-alpine
  HTTPD_IMAGE: httpd:2.4.63-alpine
  # Regole Semgrep fissate a un commit: risultati riproducibili, aggiornamento esplicito.
  SEMGREP_RULES_REF: a5ad1714f00c9f7fde980cab0ea1d6dc6d414fd2

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: backend/global.json
          cache: true
          cache-dependency-path: backend/**/packages.lock.json
      - name: Restore (lock file bloccati, audit vulnerabilità NuGet)
        run: dotnet restore --locked-mode
      - name: Formattazione
        run: dotnet format --verify-no-changes --no-restore
      - name: Build (analizzatori, avvisi = errori)
        run: dotnet build --configuration Release --no-restore
      - name: Contratto OpenAPI aggiornato
        run: |
          git diff --exit-code -- ../contracts || {
            echo "::error::Contratto OpenAPI non aggiornato: eseguire 'dotnet build' e committare contracts/"
            exit 1
          }
      - name: Test unitari e di integrazione (PostgreSQL in Testcontainers)
        run: >-
          dotnet test --configuration Release --no-build
          -- --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml
          --results-directory "$GITHUB_WORKSPACE/backend/TestResults"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-test-results
          path: backend/TestResults/
          retention-days: 7

  web:
    name: Web (React)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Audit dipendenze di produzione
        run: npm audit --omit=dev --audit-level=high
      - name: Tipi API allineati al contratto OpenAPI
        run: |
          npm run api:generate
          git diff --exit-code -- src/api/schema.d.ts || {
            echo "::error::Eseguire 'npm run api:generate' e committare"
            exit 1
          }
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Test con soglie di copertura
        run: npm run test:coverage
      - run: npm run build

  security:
    name: Segreti e script
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Ricerca di segreti nella storia Git (gitleaks)
        run: docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" git /repo --redact --verbose --exit-code 1
      - name: ShellCheck
        run: shellcheck -x deploy/*.sh deploy/tests/*.sh .github/scripts/*.sh
      # Sintassi ed espressioni dei workflow, con ShellCheck sugli script "run:".
      - name: Workflow GitHub Actions (actionlint)
        run: docker run --rm -v "$PWD:/repo" -w /repo "$ACTIONLINT_IMAGE" -color
      - name: Test del piano di rilascio
        run: .github/scripts/release-plan.test.sh
      - name: Test della validazione di .env (moscorun.sh check)
        run: deploy/tests/check.test.sh
      # CodeQL non è disponibile sui repository privati del piano Free: Semgrep (OSS) copre C#, TypeScript/React,
      # Dockerfile, GitHub Actions e Bash. Blocca la CI su risultati WARNING/ERROR.
      - name: Analisi statica di sicurezza (Semgrep)
        run: |
          git clone --quiet --filter=blob:none https://github.com/semgrep/semgrep-rules "$RUNNER_TEMP/semgrep-rules"
          git -C "$RUNNER_TEMP/semgrep-rules" checkout --quiet "$SEMGREP_RULES_REF"
          docker run --rm -v "$PWD:/src" -v "$RUNNER_TEMP/semgrep-rules:/rules:ro" -w /src "$SEMGREP_IMAGE" \
            semgrep scan --metrics=off --disable-version-check --error --severity WARNING --severity ERROR \
            --config /rules/csharp --config /rules/typescript --config /rules/javascript \
            --config /rules/dockerfile --config /rules/yaml/github-actions --config /rules/bash --config /rules/generic/nginx \
            --exclude 'web/src/api/schema.d.ts' --exclude '**/Migrations/**'

  image:
    name: Immagine, scansione ed E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, web]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build immagine (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: moscorun:ci
          build-args: |
            VERSION=0.0.0-ci
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Vulnerabilità dell'immagine (Trivy, blocca HIGH/CRITICAL risolvibili)
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE"
          image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL --no-progress moscorun:ci
      - name: Installazione con lo script di produzione
        working-directory: deploy
        run: |
          cat > .env <<EOF
          MOSCORUN_IMAGE=moscorun
          MOSCORUN_VERSION=ci
          MOSCORUN_SKIP_PULL=1
          COMPOSE_PROFILES=bundled-db
          POSTGRES_HOST=db
          POSTGRES_PASSWORD=$(openssl rand -hex 24)
          MOSCORUN_ADMIN_EMAIL=admin@moscorun.ci
          MOSCORUN_ADMIN_PASSWORD=$E2E_ADMIN_PASSWORD
          MOSCORUN_LOGIN_ATTEMPTS_PER_MINUTE=1000
          MOSCORUN_BACKUP_DIR=${{ runner.temp }}/backups
          EOF
          chmod 600 .env
          ./moscorun.sh update
        env:
          E2E_ADMIN_PASSWORD: E2e-${{ github.run_id }}-${{ github.run_attempt }}-Pass9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: E2E Playwright (desktop e mobile, accessibilità)
        working-directory: web
        env:
          E2E_BASE_URL: http://127.0.0.1:8085
          E2E_ADMIN_EMAIL: admin@moscorun.ci
          E2E_ADMIN_PASSWORD: E2e-${{ github.run_id }}-${{ github.run_attempt }}-Pass9
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Scenari operativi (smoke, riavvio, proxy, perdita DB, rollback, compatibilità N-1, backup e ripristino)
        working-directory: deploy
        env:
          E2E_ADMIN_EMAIL: admin@moscorun.ci
          E2E_ADMIN_PASSWORD: E2e-${{ github.run_id }}-${{ github.run_attempt }}-Pass9
          # Ultima release pubblicata: deve restare compatibile con lo schema migrato da questo commit.
          PREVIOUS_IMAGE: ghcr.io/${{ github.repository }}:latest
          GHCR_TOKEN: ${{ github.token }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          ./tests/scenarios.sh
      - name: Contesto dei test E2E falliti
        if: failure()
        working-directory: web
        run: find test-results -name error-context.md -exec sh -c 'echo "::group::$1"; cat "$1"; echo "::endgroup::"' _ {} \; || true
      - name: Log applicazione
        if: failure()
        working-directory: deploy
        run: docker compose logs --no-color app db
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
