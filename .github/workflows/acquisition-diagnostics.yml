name: Acquisition diagnostics (temporary)

on:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    if: github.head_ref == 'feat/scientific-acquisition-center'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: dotnet restore backend --locked-mode
      - run: dotnet format backend --no-restore
      - run: dotnet build backend --no-restore -c Release
      - working-directory: web
        run: npm ci --no-audit --no-fund
      - working-directory: web
        run: npm run api:generate
      - working-directory: web
        run: npm run format
      - name: Export generated diff
        run: git diff -- contracts/moscorun-api.json web/src/api/schema.d.ts backend web/src/features/workspace web/src/routes.tsx
      - working-directory: web
        run: npm run lint
      - working-directory: web
        if: always()
        run: npm run typecheck
      - working-directory: web
        if: always()
        run: npm run test:coverage
      - working-directory: backend
        if: always()
        run: dotnet test --no-build -c Release -- --filter-class '*ScientificIngestEndpointTests'
