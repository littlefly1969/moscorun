name: Android Probe APK
on:
  push:
    paths: ["android-probe/**", ".github/workflows/android-probe.yml"]
  pull_request:
    paths: ["android-probe/**", ".github/workflows/android-probe.yml"]
  workflow_dispatch:
    inputs:
      with_samsung:
        description: "Compila anche Samsung diretto (richiede AAR nella release privata samsung-sdk-local)"
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: android-probe-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android-probe
    env:
      MOSCORUN_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Installa piattaforma Android
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verifica ripristino firma
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Test e analisi Health Connect
        run: bash gradlew testConnectOnlyDebugUnitTest lintConnectOnlyDebug --no-daemon
      - name: Scarica SDK Samsung privato
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.with_samsung }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/libs
          gh release download samsung-sdk-local --repo "$GITHUB_REPOSITORY" --pattern samsung-health-data-api.aar --dir app/libs
          echo 'f5d3d83cf00b97d0bb1b1db4da076e861eb1c3e6e704d89a34e68909d2f38654  app/libs/samsung-health-data-api.aar' | sha256sum --check
      - name: Test e analisi Samsung
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.with_samsung }}
        run: bash gradlew testWithSamsungDebugUnitTest lintWithSamsungDebug --no-daemon
      - name: Ripristina firma stabile
        env:
          MOSCORUN_SIGNING_BUNDLE: ${{ secrets.MOSCORUN_SIGNING_BUNDLE }}
        run: |
          python3 scripts/restore-signing.py --directory "$RUNNER_TEMP/moscorun-signing"
          echo "MOSCORUN_SIGNING_PROPERTIES=$RUNNER_TEMP/moscorun-signing/signing.properties" >> "$GITHUB_ENV"
      - name: Compila APK Health Connect con firma stabile
        run: bash gradlew assembleConnectOnlyDebug --no-daemon
      - name: Compila APK Samsung con firma stabile
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.with_samsung }}
        run: bash gradlew assembleWithSamsungDebug --no-daemon
      - name: Verifica firme, identificativi e versioni APK
        run: python3 scripts/verify-apks.py
      - name: Pubblica APK
        uses: actions/upload-artifact@v4
        with:
          name: moscorun-probe-apk-${{ github.run_number }}
          path: android-probe/app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Pubblica risultati dei controlli
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moscorun-probe-checks-${{ github.run_number }}
          path: |
            android-probe/app/build/reports/tests/
            android-probe/app/build/reports/lint-results-*.html
            android-probe/app/build/reports/signing/
          if-no-files-found: ignore
          retention-days: 7
      - name: Rimuovi materiale di firma dal runner
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/moscorun-signing"
