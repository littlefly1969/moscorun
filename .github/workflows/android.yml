name: Android MoscoRun - controlli pubblicabili
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-checks:
    name: Android - controlli senza segreti
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      # Verifica anche l'integrità del Gradle wrapper; nessuna cache condivisa con le PR da fork.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true
      - name: Installa piattaforma Android
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test script con materiale sintetico
        run: python3 -m unittest discover -s scripts/tests -v
      # Senza l'AAR Samsung proprietario: compila con la sorgente sostitutiva, esegue test JVM (anche
      # Robolectric) e Lint. Nessun segreto, nessuna firma, nessun APK.
      - name: Test JVM e Lint senza SDK Samsung
        run: bash gradlew -Pmoscorun.withoutSamsungSdk=true testDebugUnitTest lintDebug --no-daemon
      # R8 della build release sul codice dell'app (con la sorgente sostitutiva): le regole si applicano e il
      # contratto JSON con il server sopravvive. Il repository privato ripete il controllo con l'SDK reale.
      - name: R8 release e contratto JSON
        run: |
          bash gradlew -Pmoscorun.withoutSamsungSdk=true :app:minifyReleaseWithR8 --no-daemon
          python3 scripts/check-r8.py
      - name: Anche in questa configurazione nessun APK viene impacchettato
        run: |
          if bash gradlew -Pmoscorun.withoutSamsungSdk=true :app:assembleDebug --continue --no-daemon > "$RUNNER_TEMP/assemble.log" 2>&1; then
            echo "::error::Senza SDK Samsung la build non deve produrre un APK."; exit 1
          fi
          grep -q "Manca il Samsung Health Data SDK" "$RUNNER_TEMP/assemble.log" \
            || { echo "::error::Diagnostica dell'AAR mancante non trovata."; tail -n 40 "$RUNNER_TEMP/assemble.log"; exit 1; }
          test -z "$(find app/build/outputs -name '*.apk' 2>/dev/null)"
