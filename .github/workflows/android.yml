name: Android MoscoRun APK
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    env:
      MOSCORUN_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Verifica configurazione Google Maps
        env:
          GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, re
          key = os.environ.get("GOOGLE_MAPS_ANDROID_API_KEY", "").strip()
          if not re.fullmatch(r"AIza[A-Za-z0-9_-]{35}", key):
              raise SystemExit("::error::Aggiungere il Repository secret GOOGLE_MAPS_ANDROID_API_KEY con la chiave Maps SDK for Android.")
          print("Chiave Maps presente e formato valido; valore non mostrato.")
          PY
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Installa piattaforma Android
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test degli script di firma e di verifica APK
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Senza l'SDK Samsung la build si ferma con una diagnostica esplicita
        run: |
          if bash gradlew :app:preBuild --no-daemon > "$RUNNER_TEMP/senza-sdk.log" 2>&1; then
            echo "::error::La build deve fallire quando manca l'AAR Samsung."; exit 1
          fi
          grep -q "Manca il Samsung Health Data SDK" "$RUNNER_TEMP/senza-sdk.log" \
            || { echo "::error::Diagnostica dell'AAR mancante non trovata."; tail -n 40 "$RUNNER_TEMP/senza-sdk.log"; exit 1; }
      - name: Scarica SDK Samsung privato
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/libs
          gh release download samsung-sdk-local --repo "$GITHUB_REPOSITORY" --pattern samsung-health-data-api.aar --dir app/libs
          echo 'f5d3d83cf00b97d0bb1b1db4da076e861eb1c3e6e704d89a34e68909d2f38654  app/libs/samsung-health-data-api.aar' | sha256sum --check
      - name: Test e analisi statica
        run: bash gradlew testDebugUnitTest lintDebug --no-daemon
      - name: Ripristina firma stabile
        env:
          MOSCORUN_SIGNING_BUNDLE: ${{ secrets.MOSCORUN_SIGNING_BUNDLE }}
        run: |
          python3 scripts/restore-signing.py --directory "$RUNNER_TEMP/moscorun-signing"
          echo "MOSCORUN_SIGNING_PROPERTIES=$RUNNER_TEMP/moscorun-signing/signing.properties" >> "$GITHUB_ENV"
      - name: Compila l'APK MoscoRun con firma stabile
        env:
          GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
        run: bash gradlew assembleDebug --no-daemon
      - name: Verifica che l'APK sia uno solo, con firma, identificativo, etichetta e versione attesi
        run: python3 scripts/verify-apks.py
      - name: Prepara l'artefatto con il solo APK
        run: |
          mkdir -p "$RUNNER_TEMP/apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/apk/MoscoRun-${MOSCORUN_VERSION_CODE}.apk"
          test "$(find "$RUNNER_TEMP/apk" -type f | wc -l)" -eq 1
      # The artifact holds the APK and nothing else: the Samsung AAR, the signing material and the reports stay out.
      - name: Pubblica APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MoscoRun-apk-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/apk/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Pubblica risultati dei controlli
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MoscoRun-controlli-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-*.html
            android/app/build/reports/signing/
          if-no-files-found: ignore
          retention-days: 7
      - name: Rimuovi materiale di firma dal runner
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/moscorun-signing"
