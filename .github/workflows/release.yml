name: Release

# Rilascio continuo da Conventional Commits, senza PR di release: quando la CI di un push su main termina
# con successo, .github/scripts/release-plan.sh calcola dai commit dopo l'ultimo tag se serve una release
# e quale versione (feat -> minor, fix/perf/security/deps -> patch, breaking -> minor finché la major è 0).
# Se serve, crea tag e GitHub Release con le note e pubblica l'immagine multi-architettura su GHCR, che il
# server installa con ./moscorun.sh update. Commit di sola documentazione, CI o manutenzione non rilasciano.
#
# Gate: prima di creare il tag verifica che la CI sia verde proprio su quel commit (tutti i job: build,
# test, segreti, Semgrep, Trivy, E2E, scenari di deploy). Un commit non verificato non arriva mai su GHCR.
# Serve solo il GITHUB_TOKEN del workflow: nessuna PR automatica né token personali.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Ripubblica l'immagine di un tag esistente (es. v0.2.0); vuoto = valuta una nuova release dall'ultimo commit di main"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Da workflow_run: solo CI riuscita su un push a main (non su PR o esecuzioni annullate).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      # Si esegue sempre il codice di main (ramo predefinito); il commit da rilasciare è usato solo come
      # oggetto git e deve appartenere alla storia di main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Piano di rilascio
        id: plan
        env:
          REPUBLISH_TAG: ${{ inputs.tag }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [[ -n "$REPUBLISH_TAG" ]]; then
            [[ "$REPUBLISH_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag non valido: $REPUBLISH_TAG"; exit 1; }
            sha="$(git rev-parse --verify "$REPUBLISH_TAG^{commit}")"
            printf 'publish=true\nnew=false\ntag=%s\nversion=%s\nsha=%s\n' "$REPUBLISH_TAG" "${REPUBLISH_TAG#v}" "$sha" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          git merge-base --is-ancestor "$TARGET_SHA" HEAD || { echo "::error::$TARGET_SHA non appartiene a main"; exit 1; }
          ./.github/scripts/release-plan.sh "$TARGET_SHA" "$RUNNER_TEMP/notes.md" | tee "$RUNNER_TEMP/plan"
          # shellcheck disable=SC1091
          source "$RUNNER_TEMP/plan"
          printf 'publish=%s\nnew=%s\ntag=%s\nversion=%s\nsha=%s\n' "$release" "$release" "$tag" "$version" "$TARGET_SHA" >>"$GITHUB_OUTPUT"
          if [[ "$release" == true ]]; then
            { echo "### Release $tag (precedente: ${previous:-nessuna})"; echo; cat "$RUNNER_TEMP/notes.md"; } >>"$GITHUB_STEP_SUMMARY"
          else
            echo "Nessun commit rilasciabile dopo ${previous:-l'inizio}: nessuna release." >>"$GITHUB_STEP_SUMMARY"
          fi
      - name: Gate - CI verde sul commit esatto
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.plan.outputs.sha }}
        run: |
          ok="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&status=success&per_page=1" --jq '.total_count')"
          if [[ "$ok" -lt 1 ]]; then
            echo "::error::Nessuna esecuzione della CI riuscita su $SHA: rilascio bloccato."
            exit 1
          fi
          echo "CI verde su $SHA: rilascio consentito."
      - name: Tag e GitHub Release
        if: steps.plan.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
          SHA: ${{ steps.plan.outputs.sha }}
        run: gh release create "$TAG" --target "$SHA" --title "MoscoRun $VERSION" --notes-file "$RUNNER_TEMP/notes.md"

  publish-image:
    needs: release
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
      - name: Versione e commit
        env:
          VERSION: ${{ needs.release.outputs.version }}
          SHA: ${{ needs.release.outputs.sha }}
        run: printf 'RELEASE_VERSION=%s\nRELEASE_SHA=%s\n' "$VERSION" "$SHA" >>"$GITHUB_ENV"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_VERSION }}
            type=semver,pattern={{major}},value=${{ env.RELEASE_VERSION }}
            type=raw,value=latest,enable=${{ inputs.tag == '' }}
      - name: Build e push multi-architettura (amd64, arm64) con SBOM e provenance
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.RELEASE_VERSION }}
            REVISION=${{ env.RELEASE_SHA }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Riepilogo
        run: |
          {
            echo "### Immagine pubblicata"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "Sul server: \`./moscorun.sh update\` (o attendere il timer notturno)."
          } >> "$GITHUB_STEP_SUMMARY"
