name: Pulizia immagini GHCR

# Mantiene lo spazio del registro entro i limiti del piano gratuito. Lo strumento riconosce le immagini
# multi-architettura (indice, manifest per piattaforma, SBOM e provenance) e non rompe le release conservate.

on:
  schedule:
    - cron: "41 4 * * 0"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Mostra soltanto cosa verrebbe eliminato"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@ac45a8c04b1eb4b27974ca79a0a74f344c93664b # v1.3.0
        with:
          package: moscorun
          # Conserva le ultime 5 versioni con tag (rollback) oltre a latest e ai tag di canale.
          keep-n-tagged: 5
          exclude-tags: latest
          delete-untagged: true
          delete-orphaned-images: true
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
