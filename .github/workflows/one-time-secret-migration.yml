name: One-time private signing migration
on:
  push:
    branches:
      - security/one-time-secret-migration
    paths:
      - .github/workflows/one-time-secret-migration.yml

permissions: {}

concurrency:
  group: one-time-private-signing-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.event.repository.private && github.event.repository.id == 1451075704 && github.ref == 'refs/heads/security/one-time-secret-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Transfer two authorized signing secrets to verified private repository
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.MIGRATION_TOKEN }}
          SIGNING_BUNDLE: ${{ secrets.MOSCORUN_SIGNING_BUNDLE }}
          MAPS_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
          GH_NO_UPDATE_NOTIFIER: '1'
          GH_NO_EXTENSION_UPDATE_NOTIFIER: '1'
        run: |
          set -euo pipefail
          set +x
          unset GH_DEBUG
          destination='littlefly1969/MoscoRun-private'
          if [[ -z "$GH_TOKEN" || -z "$SIGNING_BUNDLE" || -z "$MAPS_KEY" ]]; then
            echo 'Missing required source secret; nothing transferred.'
            exit 1
          fi
          if ! metadata="$(gh api "repos/$destination" --jq '[.id, .private] | @tsv' 2>&1)"; then
            if [[ "$metadata" =~ HTTP[[:space:]]([0-9]{3}) ]]; then
              printf 'Destination metadata unavailable (HTTP %s).\n' "${BASH_REMATCH[1]}"
            else
              echo 'Destination metadata unavailable (CLI or transport error).'
            fi
            exit 1
          fi
          if [[ "$metadata" != $'1472365715\ttrue' ]]; then
            echo 'Destination is not the expected private repository.'
            exit 1
          fi
          if ! names="$(gh secret list --repo "$destination" --app actions --json name --jq '.[].name' 2>/dev/null)"; then
            echo 'Unable to list destination secret metadata.'
            exit 1
          fi
          if grep -Fxq 'MOSCORUN_SIGNING_BUNDLE' <<< "$names" || grep -Fxq 'GOOGLE_MAPS_ANDROID_API_KEY' <<< "$names"; then
            echo 'Destination already contains a signing secret; stop to avoid unintended overwrite.'
            exit 1
          fi
          if ! printf '%s' "$SIGNING_BUNDLE" | gh secret set MOSCORUN_SIGNING_BUNDLE --repo "$destination" --app actions >/dev/null 2>&1; then
            echo 'Signing bundle transfer failed.'
            exit 1
          fi
          echo 'Signing bundle stored in private destination.'
          if ! printf '%s' "$MAPS_KEY" | gh secret set GOOGLE_MAPS_ANDROID_API_KEY --repo "$destination" --app actions >/dev/null 2>&1; then
            echo 'Maps key transfer failed; signing bundle may already exist.'
            exit 1
          fi
          echo 'Maps key stored in private destination.'
          names="$(gh secret list --repo "$destination" --app actions --json name --jq '.[].name' 2>/dev/null)"
          grep -Fxq 'MOSCORUN_SIGNING_BUNDLE' <<< "$names"
          grep -Fxq 'GOOGLE_MAPS_ANDROID_API_KEY' <<< "$names"
          echo 'Both destination secret names verified. Revoke migration token after this run.'
