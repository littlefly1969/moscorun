name: Athlete analysis foundations
on:
  pull_request:
    paths: ['tools/athlete-analysis/**', 'docs/ricerca/**', 'docs/piano-ai-allenamento.md', '.github/workflows/athlete-analysis.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: node tools/athlete-analysis/run-checks.mjs
